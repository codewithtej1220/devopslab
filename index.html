<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DevOps Event Registration</title>
</head>
<body>
    <h2>Event Registration</h2>

    <form onsubmit="return register()">
        <input type="text" id="fullName" placeholder="Full Name" required><br><br>
        <input type="text" id="rollNo" placeholder="Roll Number" required><br><br>
        <input type="email" id="email" placeholder="Email Address" required><br><br>
        <button type="submit" id="submitBtn">Register</button>
    </form>

    <p id="message"></p>

    <script>
        function register() {
            document.getElementById("message").innerText = "Registration Successful!";
            return false;
        }
    </script>
</body>
</html>
